name: fadespace

x-backend-environment: &backend-environment
  APP_NAME: FadeSpace
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  APP_KEY: "base64:krrvJw+WyDSxZJ9y+eOcxoagV29FFaWNxKNAj3l4kUg="
  APP_VERSION: 0.1.0-f0
  APP_LOCALE: es_CO
  APP_FALLBACK_LOCALE: es
  APP_FAKER_LOCALE: es_CO
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: fadespace
  DB_USERNAME: fadespace
  DB_PASSWORD: secret
  CACHE_STORE: redis
  CACHE_PREFIX: fadespace
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: "100001"
  REVERB_APP_KEY: fadespace-local-key
  REVERB_APP_SECRET: fadespace-local-secret
  # Servidor -> Reverb: nombre del servicio en la red de Compose.
  # Navegador -> Reverb: VITE_REVERB_* (host publicado en el equipo anfitrión).
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  REVERB_SCALING_ENABLED: "false"
  VITE_REVERB_APP_KEY: fadespace-local-key
  VITE_REVERB_HOST: localhost
  VITE_REVERB_PORT: "8080"
  VITE_REVERB_SCHEME: http
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: no-reply@fadespace.local

x-backend-volumes: &backend-volumes
  - ./backend:/var/www/html
  - backend-vendor:/var/www/html/vendor

services:
  app:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fadespace]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

    networks: [fadespace]

  reverb:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *backend-environment
    volumes: *backend-volumes
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fadespace]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fadespace
      MYSQL_USER: fadespace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [fadespace]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fadespace]

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [fadespace]

volumes:
  backend-vendor:
  mysql-data:
  redis-data:

networks:
  fadespace:
    driver: bridge
